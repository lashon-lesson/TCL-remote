name: tcl_remote
description: שלט WiFi לטלוויזיות TCL, סמסונג ו-LG
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  speech_to_text: ^7.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#7B5CFF"
  adaptive_icon_foreground: assets/icon_fg.png
